<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937" />
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="640" fill="#ffffff" />

  <!-- Lane headers -->
  <rect x="30"  y="10" width="180" height="40" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="2" />
  <text x="120" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Client</text>

  <rect x="370" y="10" width="200" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2" />
  <text x="470" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">JobGrain (active)</text>

  <rect x="700" y="10" width="200" height="40" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2" />
  <text x="800" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">RequestPool (thread pool)</text>

  <!-- Lifelines -->
  <line x1="120" y1="50" x2="120" y2="620" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="470" y1="50" x2="470" y2="620" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="800" y1="50" x2="800" y2="620" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- 1: SubmitAsync -->
  <line x1="120" y1="80" x2="470" y2="80" stroke="#1f2937" stroke-width="1.75" marker-end="url(#arrow3)" />
  <text x="130" y="74" font-size="12" fill="#374151">SubmitAsync()</text>

  <!-- 2: EnqueueAsync -->
  <line x1="470" y1="104" x2="800" y2="104" stroke="#1f2937" stroke-width="1.75" marker-end="url(#arrow3)" />
  <text x="480" y="98" font-size="12" fill="#374151">EnqueueAsync()</text>

  <!-- 3: accepted -->
  <line x1="800" y1="128" x2="470" y2="128" stroke="#1f2937" stroke-width="1.75" stroke-dasharray="5,3" marker-end="url(#arrow3)" />
  <text x="580" y="122" font-size="12" fill="#374151">(accepted)</text>

  <text x="480" y="150" font-size="11.5" fill="#6b7280" font-style="italic">DeactivateOnIdle() — activation released</text>
  <text x="700" y="172" font-size="11.5" fill="#6b7280" font-style="italic">HandleAsync() → (work)</text>
  <text x="700" y="190" font-size="11.5" fill="#6b7280" font-style="italic">OnProgress fires periodically</text>

  <text x="220" y="216" font-size="11.5" fill="#6b7280" font-style="italic">[deactivated]</text>

  <!-- 4: OnProgress -->
  <line x1="800" y1="250" x2="470" y2="250" stroke="#1f2937" stroke-width="1.75" stroke-dasharray="5,3" marker-end="url(#arrow3)" />
  <text x="580" y="244" font-size="12" fill="#374151">OnProgress()</text>
  <text x="220" y="270" font-size="11.5" fill="#6b7280" font-style="italic">[re-activated, one turn, deactivates]</text>

  <!-- 5: OnCompleted -->
  <line x1="800" y1="320" x2="470" y2="320" stroke="#1f2937" stroke-width="1.75" stroke-dasharray="5,3" marker-end="url(#arrow3)" />
  <text x="580" y="314" font-size="12" fill="#374151">OnCompleted()</text>
  <text x="220" y="340" font-size="11.5" fill="#6b7280" font-style="italic">[re-activated, one turn]</text>
  <text x="480" y="360" font-size="11.5" fill="#6b7280" font-style="italic">tracker.SetStatus(Completed)</text>
  <text x="480" y="378" font-size="11.5" fill="#6b7280" font-style="italic">[deactivates again]</text>

  <!-- 6: GetStatusAsync -->
  <line x1="120" y1="420" x2="470" y2="420" stroke="#1f2937" stroke-width="1.75" marker-end="url(#arrow3)" />
  <text x="130" y="414" font-size="12" fill="#374151">GetStatusAsync()</text>
  <text x="480" y="414" font-size="11.5" fill="#6b7280" font-style="italic">[re-activated if needed]</text>

  <!-- 7: Completed -->
  <line x1="470" y1="444" x2="120" y2="444" stroke="#1f2937" stroke-width="1.75" stroke-dasharray="5,3" marker-end="url(#arrow3)" />
  <text x="130" y="438" font-size="12" fill="#374151">Completed</text>

  <text x="460" y="500" text-anchor="middle" font-size="12" fill="#6b7280">
    The grain deactivates immediately after enqueuing and is re-activated for exactly one turn per progress/completion event.
  </text>
</svg>
