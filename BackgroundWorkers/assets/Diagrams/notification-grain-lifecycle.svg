<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937" />
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="560" fill="#ffffff" />

  <!-- Lane headers -->
  <rect x="30"  y="10" width="180" height="40" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="2" />
  <text x="120" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Client</text>

  <rect x="360" y="10" width="240" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2" />
  <text x="480" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">NotificationGrain (active)</text>

  <rect x="700" y="10" width="200" height="40" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2" />
  <text x="800" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">RequestPool (thread pool)</text>

  <!-- Lifelines -->
  <line x1="120" y1="50" x2="120" y2="540" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="480" y1="50" x2="480" y2="540" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="800" y1="50" x2="800" y2="540" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- 1: SendEmailAsync -->
  <line x1="120" y1="80" x2="480" y2="80" stroke="#1f2937" stroke-width="1.75" marker-end="url(#arrow2)" />
  <text x="130" y="74" font-size="12" fill="#374151">SendEmailAsync()</text>

  <!-- 2: return Pending + deactivate -->
  <line x1="480" y1="104" x2="120" y2="104" stroke="#1f2937" stroke-width="1.75" stroke-dasharray="5,3" marker-end="url(#arrow2)" />
  <text x="130" y="98" font-size="12" fill="#374151">JobStatus.Pending</text>
  <text x="490" y="98" font-size="11.5" fill="#6b7280" font-style="italic">DeactivateOnIdle()</text>
  <text x="700" y="122" font-size="11.5" fill="#6b7280" font-style="italic">EmailNotificationHandler → (work)</text>

  <!-- 3: SendSmsAsync -->
  <line x1="120" y1="160" x2="480" y2="160" stroke="#1f2937" stroke-width="1.75" marker-end="url(#arrow2)" />
  <text x="130" y="154" font-size="12" fill="#374151">SendSmsAsync()</text>
  <text x="490" y="154" font-size="11.5" fill="#6b7280" font-style="italic">[re-activated]</text>

  <!-- 4: EnqueueAsync sms -->
  <line x1="480" y1="184" x2="800" y2="184" stroke="#1f2937" stroke-width="1.75" marker-end="url(#arrow2)" />
  <text x="490" y="178" font-size="12" fill="#374151">EnqueueAsync(&quot;...:sms&quot;)</text>
  <text x="700" y="204" font-size="11.5" fill="#6b7280" font-style="italic">SmsNotificationHandler → (work)</text>

  <!-- 5: return Pending + deactivate -->
  <line x1="480" y1="222" x2="120" y2="222" stroke="#1f2937" stroke-width="1.75" stroke-dasharray="5,3" marker-end="url(#arrow2)" />
  <text x="130" y="216" font-size="12" fill="#374151">JobStatus.Pending</text>
  <text x="490" y="216" font-size="11.5" fill="#6b7280" font-style="italic">DeactivateOnIdle()</text>

  <!-- 6: OnCompleted -->
  <line x1="800" y1="280" x2="480" y2="280" stroke="#1f2937" stroke-width="1.75" stroke-dasharray="5,3" marker-end="url(#arrow2)" />
  <text x="600" y="274" font-size="12" fill="#374151">OnCompleted(output)</text>

  <text x="370" y="308" font-size="11.5" fill="#6b7280" font-style="italic">[re-activated, logs at notification level]</text>

  <!-- 7: SendEmailAsync again -->
  <line x1="120" y1="350" x2="480" y2="350" stroke="#1f2937" stroke-width="1.75" marker-end="url(#arrow2)" />
  <text x="130" y="344" font-size="12" fill="#374151">SendEmailAsync()</text>
  <text x="490" y="344" font-size="11.5" fill="#6b7280" font-style="italic">[re-activated]</text>

  <!-- 8: return Completed no-op -->
  <line x1="480" y1="374" x2="120" y2="374" stroke="#1f2937" stroke-width="1.75" stroke-dasharray="5,3" marker-end="url(#arrow2)" />
  <text x="130" y="368" font-size="12" fill="#374151">JobStatus.Completed</text>
  <text x="490" y="368" font-size="11.5" fill="#6b7280" font-style="italic">(no-op: already done)</text>

  <text x="460" y="430" text-anchor="middle" font-size="12" fill="#6b7280">
    Each channel (email/sms/push) is an independent per-channel job key — one channel completing does not affect the others.
  </text>
</svg>
