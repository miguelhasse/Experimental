<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937" />
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="620" fill="#ffffff" />

  <!-- Caller -->
  <rect x="290" y="16" width="180" height="46" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2" />
  <text x="380" y="44" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Caller</text>

  <line x1="380" y1="62" x2="380" y2="98" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)" />
  <text x="392" y="84" font-size="13" fill="#374151">IRequestPool.EnqueueAsync(context, callback)</text>

  <!-- Bounded channels -->
  <rect x="120" y="100" width="520" height="90" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2" />
  <text x="380" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Three BoundedChannels</text>

  <rect x="140" y="138" width="140" height="38" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5" />
  <text x="210" y="162" text-anchor="middle" font-size="13" fill="#1f2937">High</text>

  <rect x="310" y="138" width="140" height="38" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5" />
  <text x="380" y="162" text-anchor="middle" font-size="13" fill="#1f2937">Normal</text>

  <rect x="480" y="138" width="140" height="38" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5" />
  <text x="550" y="162" text-anchor="middle" font-size="13" fill="#1f2937">Low</text>

  <line x1="380" y1="190" x2="380" y2="226" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Workers / WRR -->
  <rect x="120" y="228" width="520" height="70" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2" />
  <text x="380" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Workers — weighted round-robin drain</text>
  <text x="380" y="280" text-anchor="middle" font-size="12" fill="#374151">default weights: High=5, Normal=3, Low=1</text>

  <line x1="380" y1="298" x2="380" y2="334" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Dispatcher -->
  <rect x="180" y="336" width="400" height="52" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2" />
  <text x="380" y="368" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">IRequestDispatcher.DispatchAsync(context, ct)</text>

  <line x1="380" y1="388" x2="380" y2="424" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Callback -->
  <rect x="150" y="426" width="460" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" />
  <text x="380" y="454" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">RequestCompletedCallback(result)</text>
  <text x="380" y="474" text-anchor="middle" font-size="12" fill="#374151">called on the worker thread</text>

  <text x="380" y="520" text-anchor="middle" font-size="12" fill="#6b7280">
    BoundedCapacity applies independently per priority channel.
  </text>
  <text x="380" y="540" text-anchor="middle" font-size="12" fill="#6b7280">
    Each priority gets a configurable token budget per WRR cycle.
  </text>
</svg>
